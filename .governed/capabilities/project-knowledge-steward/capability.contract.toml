contract_version = 1

[capability]
id = "project-knowledge-steward"
name = "Project Knowledge Steward"
governed = true
description = "Cold-start project knowledge keeper for stable repo workflows, conventions, verification commands, and signals that a dedicated governed capability should be created."

[routing]
aliases = ["$project-knowledge-steward", "project knowledge steward", "project-knowledge-steward"]
hints = [
  "project workflow",
  "repo convention",
  "verification command",
  "working pattern",
  "project knowledge",
  "durable lesson",
  "implementation pattern",
  "runbook",
  "candidate skill",
  "capability candidate",
]
negative_hints = [
  "codex-memory-review",
  "govkb install",
  "govkb apply",
  "report output",
  "cron schedule",
  "latest report",
  "task schedule",
]

[memory]
enabled = true
auto_apply_min_confidence = 0.85
requires_explicit_acceptance = false

[memory.targets.main]
path = "references/long-term-memory.md"
sections = [
  "Project Working Agreement",
  "Stable Workflows",
  "Commands And Verification",
  "Repo Conventions",
  "Code And Docs Map",
  "Authority Rules",
  "Candidate Skill Signals",
]

[bootstrap]
profile = "steward"
repo_roots = ["."]
authority_paths = ["README.md"]
seed_paths = ["README.md", "docs", "src", "tests"]

[kb_health]
requires_verification_commands = false
requires_repo_map = true
required_sections = [
  "Project Working Agreement",
  "Stable Workflows",
  "Code And Docs Map",
  "Candidate Skill Signals",
]
